<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRコード一括作成</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:sans-serif;margin:20px;color:#222}
textarea{width:100%;height:180px;font-size:15px}
button{padding:10px 18px;margin:10px 5px 10px 0;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ticket{border:1px solid #bbb;padding:10px;text-align:center;break-inside:avoid}
.name{font-weight:bold;font-size:18px;margin:6px 0}.id{font-size:12px;color:#555}
.qr{display:flex;justify-content:center}
@media print{textarea,button,h1,.help{display:none}.grid{grid-template-columns:repeat(3,1fr)}.ticket{border:1px solid #999}}
</style>
</head>
<body>
<h1>QRコード一括作成</h1>
<p class="help">1行に「ID,氏名」を入力してください。QRコードにはIDのみを格納します。</p>
<textarea id="src" placeholder="A000001,山田太郎&#10;A000002,佐藤花子"></textarea><br>
<button onclick="generate()">作成</button>
<button onclick="window.print()">印刷</button>
<div id="grid" class="grid"></div>
<script>
function generate(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const lines=document.getElementById('src').value.split(/\r?\n/).filter(Boolean);
  lines.forEach((line,i)=>{
    const p=line.split(',');
    const id=(p.shift()||'').trim();
    const name=p.join(',').trim();
    if(!id)return;
    const ticket=document.createElement('div');
    ticket.className='ticket';
    const q=document.createElement('div');q.className='qr';
    const n=document.createElement('div');n.className='name';n.textContent=name;
    const d=document.createElement('div');d.className='id';d.textContent='ID: '+id;
    ticket.append(q,n,d);grid.appendChild(ticket);
    new QRCode(q,{text:id,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});
  });
}
</script>
</body>
</html>
